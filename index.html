<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ruta del Agua: seguimos el agua del cielo a la Luna y a Marte." />
    <title>Ruta del Agua</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- theme-color = --bg: la barra del navegador móvil se funde con la página. -->
    <meta name="theme-color" content="#080C16" />
    <!-- Open Graph / Twitter: la vista previa al compartir el enlace. Sin og:image
         a propósito: aún no existe una imagen de portada aprobada por el equipo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Ruta del Agua" />
    <meta property="og:description" content="Ruta del Agua: seguimos el agua del cielo a la Luna y a Marte." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ruta del Agua" />
    <meta name="twitter:description" content="Ruta del Agua: seguimos el agua del cielo a la Luna y a Marte." />
    <!-- preconnect: abre la conexión a Google Fonts antes de pedir el CSS; display=swap evita texto invisible mientras cargan. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
